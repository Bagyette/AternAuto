plugins {
    id 'java-library'
    id 'fabric-loom' version '1.17.20' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.20' apply false
}

allprojects {
    version = '1'
    group = 'fr.bagyette.aternauto'
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

base { archivesName = 'AternAuto-common' }
dependencies {
    compileOnly 'com.google.code.gson:gson:2.2.4'
    compileOnly 'net.fabricmc:fabric-loader:0.19.5'
    compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    compileOnly 'org.ow2.asm:asm-tree:9.10.1'
    testImplementation 'com.google.code.gson:gson:2.2.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation files('.tools/asm-all.jar', '.tools/launchwrapper.jar', 'versions/forge/build/classes/java/main')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
compileJava.options.release = 8
compileTestJava.options.release = 21
compileTestJava.dependsOn ':forge:classes'
test {
    useJUnitPlatform()
    dependsOn ':forge:classes'
    systemProperty 'aternauto.workspace', projectDir.absolutePath
}

subprojects {
    def spec = rootProject.file("versions/${name}/version.json")
    if (!spec.exists()) return
    def metadata = new groovy.json.JsonSlurper().parse(spec)
    if (metadata.loader == 'fabric') {
        apply plugin: metadata.minecraft.startsWith('26.') ? 'net.fabricmc.fabric-loom' : 'fabric-loom'
        dependencies {
            minecraft "com.mojang:minecraft:${metadata.minecraft}"
            if (metadata.yarn) mappings "net.fabricmc:yarn:${metadata.yarn}:v2"
            if (metadata.minecraft.startsWith('26.')) {
                implementation 'net.fabricmc:fabric-loader:0.19.5'
            } else {
                modImplementation 'net.fabricmc:fabric-loader:0.19.5'
            }
            implementation rootProject
        }
    } else {
        apply plugin: 'java'
        dependencies {
            implementation rootProject
            compileOnly rootProject.files('.tools/minecraft-1.8.9-srg.jar', '.tools/forge-1.8.9-srg.jar', '.tools/launchwrapper.jar', '.tools/asm-all.jar')
            compileOnly 'com.mojang:authlib:1.5.21'
            compileOnly 'com.google.code.gson:gson:2.2.4'
            compileOnly 'com.google.guava:guava:17.0'
        }
        repositories { maven { url = 'https://libraries.minecraft.net/' } }
        jar {
            from(rootProject.sourceSets.main.output) {
                exclude 'fabric.mod.json', 'aternauto.mixins.json', 'aternauto-adapters.json', 'fr/autoaternos/AdapterPlugin.class'
            }
            manifest.attributes('FMLCorePlugin': 'fr.bagyette.aternauto.forge.LoadingPlugin', 'FMLCorePluginContainsFMLMod': 'true')
        }
    }
    base { archivesName = "AternAuto-${name}" }
    jar { from(rootProject.file('LICENSE')) }
    tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
    }
}
jar { from('LICENSE') }

tasks.register('formatJava', JavaExec) {
    classpath = files('.tools/google-java-format.jar')
    mainClass = 'com.google.googlejavaformat.java.Main'
    jvmArgs = ['api', 'file', 'parser', 'tree', 'util', 'code'].collect { "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED" }
    args '--replace'
    args fileTree(projectDir) { include 'src/**/*.java', 'versions/**/src/**/*.java'; exclude '**/build/**' }.files.collect { it.absolutePath }
}
tasks.register('checkJavaFormat', JavaExec) {
    classpath = files('.tools/google-java-format.jar')
    mainClass = 'com.google.googlejavaformat.java.Main'
    jvmArgs = ['api', 'file', 'parser', 'tree', 'util', 'code'].collect { "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED" }
    args '--dry-run', '--set-exit-if-changed'
    args fileTree(projectDir) { include 'src/**/*.java', 'versions/**/src/**/*.java'; exclude '**/build/**' }.files.collect { it.absolutePath }
}
tasks.register('assembleDistributions', Exec) {
    dependsOn jar, test, checkJavaFormat
    dependsOn subprojects.collect { it.tasks.named(it.name == 'forge' || it.name.startsWith('fabric-26.') ? 'jar' : 'remapJar') }
    commandLine 'python', 'tools/package_distributions.py'
}
