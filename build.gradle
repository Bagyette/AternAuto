plugins {
    id 'base'
    id 'fabric-loom' version '1.17.20' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.20' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
}
allprojects {
    version = rootProject.providers.gradleProperty('mod_version').get()
    group = 'fr.bagyette.aternauto'
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
    plugins.withId('java') {
        tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            maxParallelForks = 1
            maxHeapSize = '384m'
            systemProperty 'aternauto.workspace', rootProject.projectDir.absolutePath
        }
        tasks.named('jar') { from(rootProject.file('LICENSE')) }
    }
}
ext.python = providers.gradleProperty('python').getOrElse('python')
// Loader parents must exist before their adapter conventions are configured.
[':common', ':fabric', ':forge', ':neoforge'].each { evaluationDependsOn it }
apply from: 'gradle/loader-adapters.gradle'

def javaSources = fileTree(projectDir) {
    include 'common/src/**/*.java', 'fabric/src/**/*.java', 'forge/src/**/*.java',
            'neoforge/src/**/*.java', 'versions/**/src/**/*.java', 'tools/runtime_smoke/src/**/*.java',
            'tools/mappings/src/**/*.java'
    exclude '**/build/**'
}
['formatJava', 'checkJavaFormat'].each { name ->
    tasks.register(name, JavaExec) {
        maxHeapSize = '384m'
        classpath = files('.tools/google-java-format.jar')
        mainClass = 'com.google.googlejavaformat.java.Main'
        jvmArgs = ['api', 'file', 'parser', 'tree', 'util', 'code'].collect {
            "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED"
        }
        args name == 'formatJava' ? ['--replace'] : ['--dry-run', '--set-exit-if-changed']
        def sourceArguments = layout.buildDirectory.file("${name}-sources.args")
        args '@' + sourceArguments.get().asFile.absolutePath
        doFirst {
            def argumentFile = sourceArguments.get().asFile
            argumentFile.parentFile.mkdirs()
            argumentFile.setText(javaSources.files.sort().collect {
                it.absolutePath.replace('\\', '/')
            }.join('\n'), 'UTF-8')
        }
    }
}
tasks.register('checkBuildStructure', Exec) {
    group = 'verification'
    commandLine python, '-B', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-v'
}
tasks.register('preflightAll', Exec) {
    group = 'verification'
    description = 'Refuse a complete release while a target or launch driver is missing.'
    commandLine python, '-B', 'tools/distributions_v2.py', 'preflight'
}
tasks.register('prepareDependencies', Exec) {
    group = 'build setup'
    dependsOn 'preflightAll'
    description = 'Fetch the shared build tools and pinned Minecraft metadata once.'
    commandLine python, '-B', 'tools/prepare_versions.py'
}
tasks.register('assembleAll', Exec) {
    group = 'build'
    dependsOn 'preflightAll', 'prepareDependencies', 'checkBuildStructure', 'checkJavaFormat'
    dependsOn ':common:build', ':fabric:build', ':forge:build', ':neoforge:build'
    commandLine python, '-B', 'tools/distributions_v2.py', 'package'
}
tasks.register('verifyAllLaunches', Exec) {
    group = 'verification'
    dependsOn 'assembleAll', ':fabric:compileSmokeHarness'
    commandLine python, '-B', 'tools/launch_matrix.py'
    if (providers.gradleProperty('resumeLaunchReport').isPresent()) {
        args '--resume', providers.gradleProperty('resumeLaunchReport').get()
    }
}

tasks.register('verifyLaunch', Exec) {
    group = 'verification'
    dependsOn ':fabric:compileSmokeHarness'
    commandLine python, '-B', 'tools/launch_matrix.py', '--target',
            providers.gradleProperty('launchTarget').getOrElse('fabric-1.21.11')
}
tasks.register('buildAll') {
    group = 'build'
    description = 'Build every artifact, run unit checks and verify all Minecraft launches.'
    dependsOn 'finalizeRelease'
}

tasks.register('finalizeRelease', Exec) {
    group = 'distribution'
    description = 'Audit the verified artifacts and create the public download ZIP.'
    dependsOn 'verifyAllLaunches'
    commandLine python, '-B', 'tools/finalize_release.py'
}

tasks.register('buildPreview', Exec) {
    group = 'build'
    description = 'Build existing adapters only and package an explicitly incomplete preview.'
    dependsOn ':common:build', ':fabric:build', ':forge:launchwrapper:build'
    dependsOn 'checkBuildStructure', 'checkJavaFormat'
    commandLine python, '-B', 'tools/distributions_v2.py', 'package-preview'
}
tasks.named('build') { dependsOn 'buildAll' }
tasks.register('assembleDistributions') { dependsOn 'assembleAll' }
subprojects {
    tasks.withType(JavaCompile).configureEach {
        mustRunAfter rootProject.tasks.named('preflightAll'), rootProject.tasks.named('prepareDependencies')
    }
    tasks.withType(Test).configureEach { mustRunAfter rootProject.tasks.named('preflightAll') }
}
tasks.named('checkJavaFormat') { mustRunAfter 'prepareDependencies' }
