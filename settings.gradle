pluginManagement {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'AternAuto'
include 'common', 'fabric', 'forge', 'neoforge'
def selectedTarget = providers.gradleProperty('target').orNull
file('versions').listFiles().findAll { new File(it, 'version.json').isFile() }.sort().each { directory ->
    if (selectedTarget && directory.name != selectedTarget &&
            !(selectedTarget == 'forge-legacy' && directory.name in ['forge', 'forge-1.7.10']) &&
            !(selectedTarget == 'forge-srg-modern' && directory.name in ['forge-1.18.2', 'forge-1.19.2', 'forge-1.19.4', 'forge-1.20.1', 'neoforge-1.20.1']) &&
            !(selectedTarget == 'forge-native' && directory.name ==~ /forge-(1\.21\..*|26\..*)/) &&
            !(selectedTarget == 'neoforge-modern' && directory.name.startsWith('neoforge-') && directory.name != 'neoforge-1.20.1') &&
            !(selectedTarget == 'fabric-all' && directory.name.startsWith('fabric-')) &&
            !(directory.name == 'forge' && selectedTarget in ['forge-1.8.9', 'forge-1.12.2'])) return
    def spec = new groovy.json.JsonSlurper().parse(new File(directory, 'version.json'))
    def adapter = directory.name == 'forge' ? 'launchwrapper' : directory.name.substring(spec.loader.length() + 1).replace('.', '_')
    def path = ":${spec.loader}:${adapter}"
    include path
    project(path).projectDir = directory
}
